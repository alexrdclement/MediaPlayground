name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: embarrasdf/devops/.github/workflows/ci.yml@claude/loving-mendel-w26y87-ci-test
    permissions:
      contents: write
      pull-requests: write
    with:
      test-tasks: testDebugUnitTest :media:model:test :media:model:test-fixtures:test :model:result:test
      apple-test-tasks: ''
